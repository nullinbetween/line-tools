<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>line-tools UI tests</title>
<style>body{font:13px/1.5 ui-monospace,Menlo,monospace;padding:16px}.p{color:#1d7a37}.f{color:#b3261e;font-weight:700}
iframe{width:600px;height:400px;border:1px solid #ccc;margin:4px}</style>
</head><body>
<h1>line-tools — UI tests (Chromium-based browsers)</h1>
<p>Opens the three tools in iframes, drops the fictional files from <code>examples/</code> and presses the buttons.
Downloads are captured in memory and checked; nothing is written to your Downloads folder.</p>
<pre id="out">running…</pre>
<div id="frames"></div>
<script>
(async function () {
  const out = document.getElementById('out');
  const results = [];
  const enc = new TextEncoder();
  const get = async p => (await fetch(p, { cache: 'no-store' })).text();
  const FX = { p1: await get('../examples/chat-part-001.txt'), p2: await get('../examples/chat-part-002.txt') };
  function eq(a, b, msg) { if (a !== b) throw new Error((msg ? msg + ': ' : '') + 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a)); }
  function ok(v, msg) { if (!v) throw new Error(msg || 'expected truthy'); }
  async function test(name, fn) {
    try { await fn(); results.push({ name, pass: true }); }
    catch (e) { results.push({ name, pass: false, err: String(e && e.message || e) }); }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(cond, ms) {
    const end = Date.now() + (ms || 3000);
    while (Date.now() < end) { if (cond()) return true; await sleep(30); }
    throw new Error('timeout waiting for UI');
  }
  async function openTool(path) {
    const f = document.createElement('iframe');
    document.getElementById('frames').appendChild(f);
    await new Promise(r => { f.onload = r; f.src = path; });
    const w = f.contentWindow;
    w.__downloads = [];
    // Capture downloads instead of saving them.
    w.HTMLAnchorElement.prototype.click = function () { w.__downloads.push({ name: this.download, href: this.href }); };
    return w;
  }
  function dropFiles(w, files) {
    const dt = new w.DataTransfer();
    for (const f of files) dt.items.add(new w.File([enc.encode(f[1])], f[0]));
    w.document.getElementById('drop').dispatchEvent(new w.DragEvent('drop', { dataTransfer: dt, bubbles: true, cancelable: true }));
  }
  const $ = (w, id) => w.document.getElementById(id);

  // ---- date extractor ----
  await test('extractor: drop two files, extract Feb 1 → download includes the line continued in file 2', async () => {
    const w = await openTool('../date-extractor.html');
    dropFiles(w, [['chat-part-002.txt', FX.p2], ['chat-part-001.txt', FX.p1]]);
    await waitFor(() => !$(w, 'run').disabled);
    ok($(w, 'pickSummary').textContent.includes('chat-part-001.txt … chat-part-002.txt'), $(w, 'pickSummary').textContent);
    $(w, 'fromInput').value = '2024-02-01'; $(w, 'toInput').value = '20240201';
    $(w, 'run').click();
    await waitFor(() => w.__downloads.length === 1);
    eq(w.__downloads[0].name, 'line_extracted_20240201-20240201.txt');
    const text = await (await fetch(w.__downloads[0].href)).text();
    ok(text.includes('safe travels') && text.includes('Heading out now') && !text.includes('park tomorrow'), text);
  });
  await test('extractor: an impossible date (Feb 30) is rejected and nothing is downloaded', async () => {
    const w = await openTool('../date-extractor.html');
    dropFiles(w, [['chat-part-001.txt', FX.p1]]);
    await waitFor(() => !$(w, 'run').disabled);
    $(w, 'fromInput').value = '20240230'; $(w, 'toInput').value = '20240301';
    $(w, 'run').click();
    await sleep(100);
    eq(w.__downloads.length, 0); ok($(w, 'status').textContent.includes('Invalid date'), $(w, 'status').textContent);
  });
  await test('extractor: same name with different content → button disabled, asks to rename', async () => {
    const w = await openTool('../date-extractor.html');
    dropFiles(w, [['a.txt', '2024/01/01\nx'], ['a.txt', '2024/01/01\ny']]);
    await waitFor(() => $(w, 'pickWarn').textContent.length > 0);
    eq($(w, 'run').disabled, true); ok($(w, 'pickWarn').textContent.includes('Rename'), $(w, 'pickWarn').textContent);
  });
  await test('extractor: HTML in a file name is not executed', async () => {
    const w = await openTool('../date-extractor.html');
    dropFiles(w, [['<img src=x onerror=alert(1)>.docx', 'x'], ['b.txt', '2024/01/01\nx']]);
    await waitFor(() => $(w, 'pickWarn').textContent.length > 0);
    eq($(w, 'pickWarn').querySelectorAll('img').length, 0);
  });

  await test('extractor: while a new choice is being read the old one cannot be exported, and a slower old read never wins', async () => {
    const w = await openTool('../date-extractor.html');
    const real = w.collectTxtInputs, pending = [];
    w.collectTxtInputs = (files) => new Promise(r => pending.push({ files, r }));   // reads finish only when told to
    dropFiles(w, [['old.txt', '2024/01/01\nOLD\n']]);
    await waitFor(() => pending.length === 1);
    pending[0].r(await real(pending[0].files));
    await waitFor(() => !$(w, 'run').disabled);
    dropFiles(w, [['slow-a.txt', '2024/01/01\nSLOW-A\n']]);                     // a slow new choice…
    await waitFor(() => pending.length === 2);
    eq($(w, 'run').disabled, true, 'button must be off while the new choice is read');
    dropFiles(w, [['fast-b.txt', '2024/01/01\nFAST-B\n']]);                     // …replaced by another one
    await waitFor(() => pending.length === 3);
    pending[2].r(await real(pending[2].files));                                    // B finishes first
    await waitFor(() => !$(w, 'run').disabled);
    pending[1].r(await real(pending[1].files));                                    // then the stale A
    await sleep(100);
    ok($(w, 'pickSummary').textContent.includes('fast-b.txt'), $(w, 'pickSummary').textContent);
    $(w, 'fromInput').value = '20240101'; $(w, 'toInput').value = '20240101';
    $(w, 'run').click();
    await waitFor(() => w.__downloads.length === 1);
    const text = await (await fetch(w.__downloads[0].href)).text();
    ok(text.includes('FAST-B') && !text.includes('SLOW-A') && !text.includes('OLD'), text);
  });

  // ---- merger ----
  await test('merger: two files filed by month → merged.zip, months listed', async () => {
    const w = await openTool('../merger.html');
    dropFiles(w, [['chat-part-001.txt', FX.p1], ['chat-part-002.txt', FX.p2]]);
    await waitFor(() => !$(w, 'run').disabled);
    $(w, 'run').click();
    await waitFor(() => w.__downloads.length === 1);
    eq(w.__downloads[0].name, 'merged.zip');
    const listed = $(w, 'bucketList').textContent;
    ok(listed.includes('2024-01') && listed.includes('2024-02') && listed.includes('2024-03') && listed.includes('undated'), listed);
    const buf = await (await fetch(w.__downloads[0].href)).arrayBuffer();
    const names = w.eval('parseZipEntries')(buf).map(e => e.name);
    ok(names.includes('merged/2024/2024-02.txt'), names.join(','));
  });

  // ---- splitter ----
  await test('splitter: .txt cut at date lines → prefix_split.zip', async () => {
    const w = await openTool('../splitter.html');
    dropFiles(w, [['chat.txt', FX.p1 + FX.p2]]);
    await waitFor(() => !$(w, 'run').disabled);
    $(w, 'prefix').value = 'demo'; $(w, 'charsPerBatch').value = '150';
    $(w, 'run').click();
    await waitFor(() => w.__downloads.length === 1);
    eq(w.__downloads[0].name, 'demo_split.zip');
    ok($(w, 'status').textContent.includes('cut at date lines'), $(w, 'status').textContent);
  });
  await test('splitter: an old .doc file is rejected', async () => {
    const w = await openTool('../splitter.html');
    dropFiles(w, [['old.doc', 'x']]);
    await sleep(100);
    eq($(w, 'run').disabled, true); ok($(w, 'status').textContent.includes('.docx'), $(w, 'status').textContent);
  });

  const failed = results.filter(r => !r.pass);
  out.innerHTML = results.map(r => r.pass ? '<span class="p">PASS</span> ' + r.name
    : '<span class="f">FAIL</span> ' + r.name + ' — ' + r.err.replace(/</g, '&lt;')).join('\n')
    + '\n\n' + (results.length - failed.length) + '/' + results.length + ' passed';
  document.title = (failed.length ? 'FAIL ' : 'PASS ') + (results.length - failed.length) + '/' + results.length;
  window.__TEST_RESULTS__ = results;
})();
</script>
</body></html>
